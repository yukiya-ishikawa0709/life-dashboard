name: バグ報告
description: 動作不具合の報告
title: "[Bug] "
labels:
  - "bug"
body:
  - type: textarea
    id: description
    attributes:
      label: 内容
      description: 何が起きたかを簡潔に。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: 環境
      placeholder: "例: macOS Tahoe 26 / Tauri 2.0"
    validations:
      required: false
